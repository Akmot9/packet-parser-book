<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 898" width="900" height="898" role="img" aria-labelledby="t d">
<title id="t">The structs behind each layer</title>
<desc id="d">Each field of PacketFlow is a struct of its own. LinkLayer exposes the LINKTYPE, the announced network protocol, the format-specific view and the L3 bytes; Internet the addresses, their type, the protocol name and the announced transport protocol; Transport the protocol and the ports; Application the label. payload, network_payload and details are not part of the flow identity.</desc>
