<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 472" width="900" height="472" role="img" aria-labelledby="t d">
<title id="t">Each layer is parsed from the payload of the previous one</title>
<desc id="d">The link layer has a network payload and announces the network protocol: the internet layer is parsed from them. The internet layer has a payload and announces the transport protocol: the transport layer is parsed from them. The transport payload and its ports go to the application probes.</desc>
<rect x="12" y="12" width="876" height="448" rx="18" fill="#FFEAD6" stroke="#FF9E42" stroke-width="2.5"/>
<text x="40" y="62" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1E1E1E" text-anchor="start">Each layer is parsed from the payload of the previous one</text>
<text x="40" y="88" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1E1E1E" fill-opacity="0.6" text-anchor="start">and each layer announces what the next one is</text>
