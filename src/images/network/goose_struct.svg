<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 824" width="900" height="824" role="img" aria-labelledby="t d">
<title id="t">GOOSE: 8 header bytes, then the goosePdu</title>
<desc id="d">The GOOSE frame of a GE F650 relay, frame 1 of iti_GOOSE.pcap, after the EtherType 0x88B8: APPID 1, length 145, two zero reserved fields, then the BER-encoded goosePdu (tag 61, length 134) whose fields are shown with their tag and length bytes: gocbRef, timeAllowedtoLive 40000, datSet, goID, the timestamp, stNum 1, sqNum 10, simulation false, confRev 1, ndsCom false, numDatSetEntries 8 and the 32-byte allData; GoosePacket and GoosePdu on the right carry the decoded values.</desc>
