# Two jobs, two trust levels:
#
# - `validate` runs on every pull request and every push to main with
#   read-only permissions: source checks, book build, examples. A missing
#   chapter, a broken link or an example that does not compile fails it.
# - `deploy` publishes to GitHub Pages only on a push to main (or a manual
#   run), after `validate`, and is the only job holding Pages permissions.
name: Book

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in sync with readme.md ("Build locally").
  MDBOOK_VERSION: 0.4.48

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook ${{ env.MDBOOK_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "${HOME}/.local/bin"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location "$url" \
            | tar -xz -C "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          "${HOME}/.local/bin/mdbook" --version

      - name: Install the Rust toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Check the book sources
        run: python3 tools/check_book.py

      - name: Build the book
        run: mdbook build

      - name: Compile and run the examples
        working-directory: examples
        run: cargo test --locked

      - name: Upload the built book
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
